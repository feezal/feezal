name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  license-gate:
    name: Dependency license gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        run: npm ci --ignore-scripts --prefix server

      - name: Install www dependencies
        run: npm ci --ignore-scripts --prefix www

      - name: Check production dependency licenses
        run: node scripts/check-licenses.js

      # A34: verify registry signatures/attestations for the whole tree —
      # a tampered tarball (registry-level compromise) fails the gate.
      - name: Verify dependency signatures
        run: |
          npm audit signatures --prefix server
          npm audit signatures --prefix www

  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install server dependencies
        run: npm ci --ignore-scripts --prefix server

      - name: Tests with coverage gate
        run: npm run test:coverage --prefix server

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage/
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: server/coverage/lcov.info
          flags: backend

  frontend:
    name: Frontend (logic + component + E2E)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The E2E suite spawns the real server and resolves aedes/adm-zip
      # through the server workspace.
      - name: Install server dependencies
        run: npm ci --ignore-scripts --prefix server

      - name: Install www dependencies
        run: npm ci --ignore-scripts --prefix www

      - name: Logic-unit tests with coverage gate
        run: npm run test:coverage --prefix www

      - name: Install Playwright browsers
        working-directory: www
        run: npx playwright install --with-deps chromium firefox webkit

      # A31 W1: the chromium pass runs WITH coverage (v8 browser coverage is
      # Chromium-only — see vitest.browser.config.mjs), so it is split out of
      # the matrix rather than added on top; firefox/webkit still run, they
      # are there to catch engine differences, not to add covered lines.
      - name: Component tests (chromium, with coverage)
        run: npm run test:browser:coverage --prefix www

      - name: Component tests (firefox + webkit)
        run: npm run test:browser --prefix www
        env:
          FEEZAL_TEST_BROWSERS: firefox,webkit

      # FEEZAL_COVERAGE: build with inline sourcemaps and collect Chromium V8
      # coverage in the E2E harness (see www/test-e2e/harness.js).
      - name: Build editor + viewer bundle
        run: npm run build --prefix www
        env:
          FEEZAL_COVERAGE: '1'

      - name: E2E happy path
        run: npm run test:e2e --prefix www
        env:
          FEEZAL_COVERAGE: '1'

      - name: E2E coverage report
        run: npm run coverage:e2e-report --prefix www

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: www/coverage/
          if-no-files-found: ignore

      # A31: kept as its own artifact so the merge job can restore it to the
      # exact path scripts/coverage-merge.mjs reads.
      - name: Upload component coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-coverage
          path: www/coverage-browser/
          if-no-files-found: ignore

      - name: Upload E2E coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage
          path: www/coverage-e2e/
          if-no-files-found: ignore

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: www/coverage/lcov.info
          flags: frontend

      - name: Upload component coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: www/coverage-browser/lcov.info
          flags: components

      - name: Upload E2E coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: www/coverage-e2e/lcov.info
          flags: e2e

      - name: Upload element coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: www/coverage-e2e/lcov-elements.info
          flags: elements

  coverage:
    name: Coverage (merged overall + floor)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    # A31: the three suites measure three different denominators, and www/src
    # is driven by two of them — read separately none of them answers "how much
    # of feezal is tested". This job merges them (union per file, summed hits)
    # into the one number the floor is enforced against.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore backend coverage
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: server/coverage

      - name: Restore frontend logic coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: www/coverage

      - name: Restore component coverage
        uses: actions/download-artifact@v4
        with:
          name: component-coverage
          path: www/coverage-browser

      # Additive: the E2E reports only ever turn a miss into a hit for a file
      # the suites above already measure (see scripts/coverage-merge.mjs), so
      # the merge stays valid — and the gate stays stable — if E2E produced
      # nothing.
      - name: Restore E2E coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: e2e-coverage
          path: www/coverage-e2e

      # The don't-sink-again floor. Set a few points below the achieved figure
      # so normal churn cannot make CI flaky; raise it when the number rises.
      - name: Merge coverage + enforce the floor
        run: node scripts/coverage-merge.mjs --min 71

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload merged coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: overall
