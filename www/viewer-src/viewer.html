<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feezal</title>
<!--<link rel="manifest" href="manifest.json">-->

<style>
    html, body {
        width: 100%;
        /* B120 — the VISIBLE height, not the initial containing block.
           height:100% resolves against the ICB, which in an iOS standalone PWA
           (viewport-fit=cover) can exceed the visual viewport: the document
           itself became scrollable, revealing unpainted layers below the
           content and carrying the layout-app bar away with it.
           -webkit-fill-available first so 100dvh wins wherever both are
           understood; the plain 100% stays as the floor for everything else. */
        height: 100%;
        height: -webkit-fill-available;
        height: 100dvh;
        /* Structural rather than a matter of exact pixels. A view TALLER than
           the screen still scrolls — inside feezal-site, which is where the
           scrolling always belonged. */
        overflow: hidden;
        overscroll-behavior: none;
        padding: 0;
        margin: 0;

        font-family: 'Roboto', sans-serif;
        font-size: 14px;
    }
    .feezal-view {
        margin: auto !important;
    }

</style>

<link href="/fonts/fonts.css" rel="stylesheet">

<script>
    window.feezal = {
        elements: new Set(),
        define: (tag, elem) => {
            window.customElements.define(tag, elem);
            window.feezal.elements.add(tag);
        },
        get app() {
            return document.querySelector('feezal-app-viewer');
        },
        get connection() {
            return document.querySelector('feezal-connection');
        },
        get site() {
            return feezal.app.querySelector('feezal-site');
        },
        get view() {
            return feezal.getView(feezal.site && feezal.site.view);
        },
        get views() {
            return feezal.app.querySelectorAll('feezal-view');
        },
        get container() {
            return feezal.app.shadowRoot.querySelector('#container');
        },
        getView(name) {
            if (!name) {
                return feezal.site.querySelector('feezal-view');
            }
            return feezal.site.querySelector('feezal-view[name="' + name + '"]');
        }
    };
</script>

<script type="module" src="../src/feezal-connection.js"></script>
<script type="module" src="feezal-elements.js"></script>
<script type="module" src="../src/feezal-app-viewer.js"></script>
